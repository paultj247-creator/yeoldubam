<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>열두 밤</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<base href="/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --room:#24170f;--room-2:#2f1f14;
    --wood:#8a5226;--wood-hi:#b9773e;--wood-lo:#5e3517;
    --sky:#1c2850;--sky-2:#121a36;
    --paper:#f7f0e2;--paper-2:#efe4cf;
    --gold:#f2c14e;--berry:#b23a3a;
    --ink:#2a2018;--muted:#7a6a58;
    --text:#f3e9d6;--text-soft:#c9b79d;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Noto Sans KR",system-ui,sans-serif;color:var(--text);line-height:1.6;word-break:keep-all;-webkit-font-smoothing:antialiased;
    min-height:100dvh;
    background:radial-gradient(120% 60% at 70% 0%,rgba(242,193,78,.16),transparent 60%),var(--room);
  }
  img{display:block;max-width:100%;height:auto}
  :focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
  .app{max-width:480px;margin:0 auto;padding:26px 20px 40px}

  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .to{font-family:"Gowun Batang",serif;font-weight:700;font-size:30px;line-height:1.2;color:#fff;letter-spacing:-.03em}
  .from{margin-top:4px;font-size:14px;color:var(--text-soft)}
  .count{text-align:right;flex-shrink:0}
  .count b{display:block;font-family:"Gowun Batang",serif;font-size:30px;line-height:1;color:var(--gold)}
  .count span{font-size:12px;color:var(--text-soft)}

  .window{margin-top:26px}
  .frame{padding:12px;border-radius:6px;background:linear-gradient(135deg,var(--wood-hi),var(--wood) 40%,var(--wood-lo));box-shadow:0 30px 50px -28px rgba(0,0,0,.85),inset 0 0 0 1px rgba(255,220,170,.15)}
  .sill{height:16px;margin:0 -12px;border-radius:4px;background:linear-gradient(var(--wood-hi),var(--wood-lo));box-shadow:0 10px 18px -8px rgba(0,0,0,.7)}
  .panes{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;background:var(--wood-lo);padding:7px;border-radius:3px}
  .pane{
    position:relative;aspect-ratio:4/5;border:0;cursor:pointer;font:inherit;color:#8e98b8;border-radius:2px;overflow:hidden;
    background:radial-gradient(1px 1px at 22% 28%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 70% 18%,#fff 50%,transparent 51%),radial-gradient(1.2px 1.2px at 58% 52%,#fff 50%,transparent 51%),linear-gradient(var(--sky),var(--sky-2));
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:7px;transition:transform .2s var(--ease)
  }
  .pane:active{transform:scale(.97)}
  .pane .d{font-family:"Gowun Batang",serif;font-size:20px;font-weight:700;line-height:1}
  .pane .m{font-size:10px;margin-top:3px;opacity:.8}
  .pane.locked{filter:saturate(.7) brightness(.8)}
  .pane.ready{color:#fff;box-shadow:inset 0 0 0 2px var(--gold)}
  .pane.ready::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 75%,rgba(242,193,78,.45),transparent 65%);animation:breathe 2.4s ease-in-out infinite}
  .pane.ready .m{color:var(--gold);opacity:1;font-weight:700;position:relative;z-index:1}
  .pane.ready .d{position:relative;z-index:1}
  .pane.xmas{box-shadow:inset 0 0 0 2px var(--berry)}
  .pane.xmas.ready{box-shadow:inset 0 0 0 2px var(--gold)}

  /* 열린 창: 그날 내용이 보이는 종이 */
  .pane.lit{background:#f4e7cf;color:var(--ink);justify-content:flex-start;align-items:stretch;padding:6px 6px 0;text-align:left}
  .pane.lit::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 55% at 85% 100%,rgba(242,193,78,.32),transparent 70%);pointer-events:none}
  .pane.lit.xmas{background:#f6e2d8;box-shadow:inset 0 0 0 2px var(--berry)}
  .pane.lit .d{position:relative;font-size:12px;color:#9a7b55;line-height:1}
  .pane.lit .m{display:none}
  .pane.lit .t{position:relative;z-index:1;font-family:"Nanum Pen Script",cursive;font-weight:400;font-size:clamp(14px,3.9vw,20px);line-height:1.05;color:var(--ink);margin-top:4px;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:break-word;max-width:100%}
  .pane.lit .who{position:absolute;right:-8%;bottom:-5%;width:40%;height:auto;animation:pop .45s var(--ease)}
  .pane.lit .pol{position:relative;display:block;margin:auto;width:84%;background:#fffdf8;padding:3px 3px 0;box-shadow:0 3px 6px -2px rgba(60,35,10,.4);transform:rotate(var(--r,-3deg));animation:pop .45s var(--ease)}
  .pane.lit .pol i{display:block;aspect-ratio:1/1;background:var(--tone,#cfd8e3);position:relative;overflow:hidden}
  .pane.lit .pol i img{position:absolute;left:50%;bottom:-10%;width:74%;height:auto;transform:translateX(-50%)}
  .pane.lit .pol em{display:block;font-style:normal;font-family:"Nanum Pen Script",cursive;font-size:clamp(13px,3.6vw,17px);line-height:1.4;text-align:center;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}

  .status{display:flex;align-items:flex-end;gap:14px;margin-top:26px}
  .status img{width:60px;flex-shrink:0}
  .status b{display:block;font-size:16px;color:#fff}
  .status span{font-size:13px;color:var(--text-soft)}

  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;width:calc(100% - 40px);max-width:420px;background:var(--paper);color:var(--ink);border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 20px 40px -16px rgba(0,0,0,.6);transition:opacity .25s,transform .35s var(--ease);z-index:70}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast img{width:44px;flex-shrink:0}
  .toast p{font-size:14px}
  .toast p b{display:block}

  .scrim{position:fixed;inset:0;z-index:60;background:rgba(15,10,6,.7);display:none;align-items:flex-end;justify-content:center;padding:14px}
  .scrim.show{display:flex}
  .sheet{position:relative;width:100%;max-width:440px;background:var(--paper);color:var(--ink);border-radius:4px;padding:26px 22px 20px;animation:rise .45s var(--ease);max-height:92dvh;overflow:auto;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
  @keyframes rise{from{transform:translateY(30px) rotate(-1.5deg);opacity:0}to{transform:none;opacity:1}}
  .sheet .bt{position:absolute;right:14px;top:-52px;width:70px}
  .label{font-size:12px;font-weight:700;color:var(--berry)}
  .ph{margin-top:14px;aspect-ratio:4/3;background:var(--paper-2);border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:13px;text-align:center;gap:2px;padding:14px;outline:1.5px dashed #cbb999;outline-offset:-10px}
  .ph strong{color:var(--ink);font-size:14px}
  .msg{font-family:"Nanum Pen Script",cursive;font-size:31px;line-height:1.18;margin-top:16px;white-space:pre-line}
  .sign{font-size:12px;color:var(--muted);margin-top:16px;padding-top:10px;border-top:1px dashed #d8c9ad}
  .close{margin-top:18px;width:100%;min-height:48px;font:inherit;font-weight:700;font-size:15px;border:0;border-radius:8px;background:var(--ink);color:var(--paper);cursor:pointer}

  .demo-bar{margin-top:40px;padding-top:18px;border-top:1px dashed #4a3424}
  .demo-bar label{display:flex;justify-content:space-between;font-size:13px;color:var(--text-soft)}
  .demo-bar label b{color:var(--gold)}
  .demo-bar input{width:100%;margin-top:10px;accent-color:var(--gold);min-height:28px}
  .demo-bar p{font-size:12px;color:#8f7d64;margin-top:6px}
  .pane.lit .pol i img.real{left:0;bottom:0;width:100%;height:100%;object-fit:cover;transform:none}
  .ph img{width:100%;height:100%;object-fit:cover;border-radius:3px}
  .ph.real{padding:0;outline:0;background:none}
  .err{margin-top:30px;padding:22px;border-radius:8px;background:var(--room-2);text-align:center;color:var(--text-soft)}
  .err img{width:90px;margin:0 auto 10px;display:block}
  .err b{display:block;color:#fff;font-size:16px;margin-bottom:4px}
  .made{margin-top:28px;text-align:center;font-size:12px;color:#8f7d64}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <div>
      <h1 class="to" id="to">열두 밤</h1>
      <p class="from" id="from"></p>
    </div>
    <div class="count"><b id="nights">12</b><span id="nightsLabel">크리스마스까지</span></div>
  </div>

  <div class="window">
    <div class="frame"><div class="panes" id="panes"></div></div>
    <div class="sill"></div>
  </div>

  <div class="status">
    <img id="stage" src="assets/flame1.png" alt="" width="200" height="254">
    <div><b id="statusTitle"></b><span id="statusSub"></span></div>
  </div>

  <p class="made">열두 밤 · yeoldubam.store</p>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">
  <img src="assets/sleepy.png" alt="">
  <p id="toastText"></p>
</div>

<div class="scrim" id="scrim" role="dialog" aria-modal="true" aria-labelledby="sheetLabel">
  <div class="sheet">
    <img class="bt" src="assets/letter.png" alt="">
    <div class="label" id="sheetLabel"></div>
    <div class="ph" id="sheetPhoto"></div>
    <p class="msg" id="sheetMsg"></p>
    <p class="sign" id="sheetSign"></p>
    <button class="close" id="sheetClose" type="button">닫기</button>
  </div>
</div>

<script>
  /* 편지는 링크의 # 뒤 코드·열쇠로 서버에서 받아 와요. 아직 안 열린 날의 편지는 서버가 내주지 않아요 */
  const API = "https://script.google.com/macros/s/AKfycbycLLIUftHpdpFSdSkWetdcImSmhytF2ATBIdR7V4Lj8Zu5F-AQnRivqqREFDRkpriz0A/exec";
  let GIFT = null, KEYNAME = "twelve-opened", CODE = "", KEY = "";
  const PHOTOS = {}, LOADING = {};
  function api(extra){ return fetch(API + "?c=" + encodeURIComponent(CODE) + "&k=" + encodeURIComponent(KEY) + (extra || "")).then(r => r.json()); }
  function loadPhoto(d){
    if (PHOTOS[d] || LOADING[d]) return;
    LOADING[d] = true;
    api("&p=" + d).then(j => { if (j.ok) { PHOTOS[d] = j.data; render(); if (lastDay === d && scrim.classList.contains("show")) fillPhoto(d); } })
      .catch(() => {}).finally(() => { LOADING[d] = false; });
  }
  const EMPTY_MSG = "오늘 밤은 편지 대신\n촛불을 켜 둘게.\n내일 또 만나.";


  const LOOK = [
    ["wave","#cfdbe6"],["happy","#ead6c3"],["letter","#e9cdb4"],["sleepy","#c9d3d8"],
    ["flame2","#d9d3e6"],["excited","#e6dcc4"],["happy","#f0d6cf"],["flame3","#c6cbdd"],
    ["wave","#d6e0cf"],["letter","#e6d2dc"],["excited","#ead8be"],["scarf","#ebcac3"]
  ];
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  function titleOf(item){ return item.t || (item.msg ? String(item.msg).split("\n")[0] : "촛불 켜 둔 밤"); }
  function litHTML(item, i, photo){
    const [who, tone] = LOOK[i] || LOOK[0];
    if (photo && item.photo) loadPhoto(item.d);
    const title = esc(titleOf(item));
    const num = '<span class="d">' + item.d + '</span>';
    if (photo) {
      const r = (i % 3 - 1) * 3 || -2;
      return '<span class="pol" style="--r:' + r + 'deg;--tone:' + tone + '"><i>' + (item.photo && PHOTOS[item.d] ? '<img class="real" src="' + PHOTOS[item.d] + '" alt="">' : '<img src="assets/' + who + '.png" alt="">') + '</i><em>12.' + item.d + '</em></span>';
    }
    return num + '<span class="t">' + title + '</span><img class="who" src="assets/' + who + '.png" alt="">';
  }
  /* 서명: 받침 있으면 '이가', 없으면 '가', 한글이 아니면 이름만 */
  function signOf(name){
    const n = String(name).trim(), c = n.charCodeAt(n.length - 1);
    if (c < 0xAC00 || c > 0xD7A3) return n;
    return n + ((c - 0xAC00) % 28 ? "이가" : "가");
  }
  const ordinal = ["첫","두","세","네","다섯","여섯","일곱","여덟","아홉","열","열한","열두"];
  const $ = id => document.getElementById(id);
  const panes = $("panes"), scrim = $("scrim");
  let lastDay = null, toastTimer = null;

  let opened = new Set();
  function load(){ try { opened = new Set(JSON.parse(localStorage.getItem(KEYNAME) || "[]")); } catch(e) {} }
  function save(){ try { localStorage.setItem(KEYNAME, JSON.stringify([...opened])); } catch(e) {} }

  function today(){
    if (GIFT && typeof GIFT.today === "number") return GIFT.today;
    const now = new Date();
    if (now.getFullYear() > GIFT.year || now.getMonth() > 11) return 26;
    if (now.getMonth() < 11) return 0;
    return now.getDate();
  }

  function render(){
    const t = today();
    panes.innerHTML = "";
    GIFT.days.forEach((item, i) => {
      const b = document.createElement("button");
      const xmas = item.d === 25;
      const isOpen = opened.has(item.d) && item.d <= t;
      const ready = !isOpen && item.d <= t;
      const locked = item.d > t;
      b.type = "button";
      b.className = "pane" + (xmas ? " xmas" : "") + (isOpen ? " lit" : "") + (ready ? " ready" : "") + (locked ? " locked" : "");
      b.dataset.day = item.d;
      b.setAttribute("aria-label", "12월 " + item.d + "일, " + (locked ? "아직 잠겨 있음" : isOpen ? "열었음" : "열 수 있음"));
      const sub = ready ? (item.d === t ? "오늘" : "열 수 있어요") : (xmas ? "Christmas" : "12월");
      b.innerHTML = isOpen ? litHTML(item, i, GIFT.photos)
        : '<span class="d">' + item.d + '</span><span class="m">' + sub + '</span>';
      b.addEventListener("click", () => locked ? showLocked(item.d) : openDay(i));
      panes.appendChild(b);
    });

    const n = GIFT.days.filter(x => opened.has(x.d) && x.d <= t).length;
    $("stage").src = n >= 12 ? "assets/scarf.png" : n >= 8 ? "assets/flame3.png" : n >= 4 ? "assets/flame2.png" : "assets/flame1.png";
    const left = Math.max(0, 25 - t);
    $("nights").textContent = t >= 25 ? "오늘" : (t < 14 ? 12 : left) + "밤";
    $("nightsLabel").textContent = t >= 25 ? "메리 크리스마스" : "크리스마스까지";
    if (t < 14) {
      $("statusTitle").textContent = "내일 밤부터 하나씩 열려요";
      $("statusSub").textContent = "12월 14일 밤 12시에 첫 번째 창이 열려요";
    } else if (n === 12) {
      $("statusTitle").textContent = "열두 밤을 모두 열었어요";
      $("statusSub").textContent = "지난 편지는 언제든 다시 읽을 수 있어요";
    } else {
      const waiting = GIFT.days.filter(x => x.d <= t && !opened.has(x.d)).length;
      $("statusTitle").textContent = waiting ? "오늘 열 수 있는 창이 " + waiting + "개 있어요" : "오늘 편지까지 다 읽었어요";
      $("statusSub").textContent = waiting ? "반짝이는 창을 눌러보세요" : "내일 밤 12시에 다음 창이 열려요";
    }
  }

  function showLocked(d){
    $("toastText").innerHTML = "<b>아직 잠들어 있어요</b>12월 " + d + "일 밤 12시에 열려요.";
    const el = $("toast");
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
  }

  function openDay(i){
    const item = GIFT.days[i];
    lastDay = item.d;
    opened.add(item.d); save();
    $("sheetLabel").textContent = item.d === 25 ? "크리스마스, 마지막 편지" : ordinal[i] + " 번째 밤";
    const ph = $("sheetPhoto");
    if (item.photo) { ph.style.display = "flex"; fillPhoto(item.d); loadPhoto(item.d); }
    else ph.style.display = "none";
    $("sheetMsg").textContent = item.msg || EMPTY_MSG;
    $("sheetSign").textContent = "12월 " + item.d + "일, " + signOf(GIFT.from);
    scrim.classList.add("show");
    $("sheetClose").focus();
    render();
  }

  function fillPhoto(d){
    const ph = $("sheetPhoto");
    if (PHOTOS[d]) { ph.className = "ph real"; ph.innerHTML = '<img src="' + PHOTOS[d] + '" alt="12월 ' + d + '일 사진">'; }
    else { ph.className = "ph"; ph.innerHTML = "<span>사진을 불러오고 있어요</span>"; }
  }

  function closeSheet(){
    scrim.classList.remove("show");
    const el = panes.querySelector('[data-day="' + lastDay + '"]');
    if (el) el.focus();
  }
  $("sheetClose").addEventListener("click", closeSheet);
  scrim.addEventListener("click", e => { if (e.target === scrim) closeSheet(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && scrim.classList.contains("show")) closeSheet(); });

  function fail(msg){
    document.querySelector(".window").outerHTML = '<div class="err"><img src="assets/sleepy.png" alt=""><b>창문이 열리지 않아요</b>' + msg + '</div>';
    document.querySelector(".status").remove(); document.querySelector(".count").remove();
  }
  async function boot(){
    const m = location.hash.match(/^#([A-Za-z0-9]{6})\.([A-Za-z0-9]{8,})$/);
    if (!m) return fail("받은 링크를 끝까지 그대로 열어 주세요.<br>주소 맨 뒤 # 부분까지 있어야 열려요.");
    CODE = m[1].toUpperCase(); KEY = m[2];
    $("statusTitle").textContent = "창문을 여는 중이에요";
    let j;
    try { j = await api(""); } catch (e) { return fail("인터넷 연결을 확인하고 다시 열어 주세요."); }
    if (!j || !j.ok) return fail("받은 링크를 끝까지 그대로 열어 주세요.<br>그래도 안 되면 보내 준 사람에게 알려 주세요.");
    const got = {}; (j.days || []).forEach(x => got[x.d] = x);
    GIFT = { to: j.to, from: j.from, photos: j.photos, today: j.today, year: 2026, days: [] };
    for (let d = 14; d <= 25; d++) GIFT.days.push(got[d] || { d: d, msg: "", photo: false });
    KEYNAME = "twelve-opened-" + CODE;
    load();
    $("to").textContent = GIFT.to + "에게";
    $("from").textContent = signOf(GIFT.from) + " 보낸 열두 밤";
    document.title = GIFT.to + "에게 · 열두 밤";
    render();
  }
  boot();
</script>
</body>
</html>
